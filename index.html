<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Vedantu Learning Experience 2.0 — Concept</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#fff8f2;--card:#fff;--ink:#2a1e1a;--mut:#7a6a62;--line:#f1e3d9;--pri:#f26b1d;--pri-d:#d9560b;--pri-s:#fff0e4;--plum:#6d366c;--plum-s:#f4e8f3;--ok:#16a34a;--ok-s:#e6f7ec;--warn:#b7791f;--warn-s:#fff4d6;--bad:#dc2626;--bad-s:#fde8e8;--sh:0 6px 22px #f26b1d14}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1210;--card:#251a16;--ink:#fbefe6;--mut:#c4ad9f;--line:#3a2a22;--pri:#ff8a3d;--pri-d:#f26b1d;--pri-s:#3a2214;--plum:#d9a5d8;--plum-s:#3a2339;--ok:#4ade80;--ok-s:#12301f;--warn:#f5c04a;--warn-s:#3a2d0e;--bad:#f87171;--bad-s:#3a1717;--sh:none}}
:root[data-theme="dark"]{--bg:#1a1210;--card:#251a16;--ink:#fbefe6;--mut:#c4ad9f;--line:#3a2a22;--pri:#ff8a3d;--pri-d:#f26b1d;--pri-s:#3a2214;--plum:#d9a5d8;--plum-s:#3a2339;--ok:#4ade80;--ok-s:#12301f;--warn:#f5c04a;--warn-s:#3a2d0e;--bad:#f87171;--bad-s:#3a1717;--sh:none}
*{box-sizing:border-box}html,body{height:auto;margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.55 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer}h1,h2,h3,p{margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:auto;display:flex;align-items:center;gap:18px;padding:10px 20px}
.logo{font-weight:800;font-size:21px;color:var(--pri);letter-spacing:-.5px;display:flex;align-items:center;gap:8px}.logo i{font-style:normal;background:var(--pri);color:#fff;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:17px}
.tag{font-size:10px;font-weight:700;color:var(--plum);background:var(--plum-s);padding:3px 8px;border-radius:99px;letter-spacing:.04em}
nav{display:flex;gap:2px;flex:1}nav button{background:none;border:0;color:var(--mut);padding:9px 13px;border-radius:99px;font-weight:600;font-size:14px;transition:.15s}
nav button:hover{background:var(--pri-s);color:var(--pri)}nav button.on{color:#fff;background:var(--pri)}nav span{margin-right:5px}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--plum));color:#fff;border:0;font-weight:700}
.menu{position:absolute;right:20px;top:58px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px #0003;width:260px;padding:8px;z-index:30}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px;border-radius:10px;color:var(--ink)}.menu button:hover{background:var(--pri-s)}.menu .h{padding:10px;color:var(--mut);font-size:13px;border-bottom:1px solid var(--line);margin-bottom:4px}
main{max-width:1080px;margin:auto;padding:22px 20px 150px;animation:in .3s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.grid{display:grid;gap:18px;grid-template-columns:1.35fr 1fr}.g2{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,#ff8a3d 0%,#f26b1d 55%,#d9560b 100%);color:#fff;border:0;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;background:#ffffff1f}
.hero .bar2{background:#ffffff40}.hero .bar2 i{background:#fff}
.tip{display:flex;gap:10px;background:var(--plum-s);color:var(--plum);border-radius:14px;padding:11px 14px;font-size:13px;margin-bottom:18px;font-weight:500}
h1{font-size:28px;letter-spacing:-.6px;font-weight:700;line-height:1.2}h2{font-size:18px;margin-bottom:12px;font-weight:700}h3{font-size:15px;font-weight:600}.mut{color:var(--mut)}.sm{font-size:13px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--pri);text-transform:uppercase;margin-bottom:8px}
.btn{background:var(--pri);color:#fff;border:0;padding:12px 20px;border-radius:99px;font-weight:600;transition:.15s;box-shadow:0 4px 14px #f26b1d44}.btn:hover{background:var(--pri-d);transform:translateY(-2px)}.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.sec:hover{border-color:var(--pri);color:var(--pri)}.btn.w{background:#fff;color:var(--pri-d);box-shadow:none}.btn.sm{padding:8px 15px;font-size:13px}.btn:disabled{opacity:.6;cursor:wait;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}.mt{margin-top:16px}.mt2{margin-top:8px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:4px 11px;border-radius:99px}.ok{background:var(--ok-s);color:var(--ok)}.warn{background:var(--warn-s);color:var(--warn)}.bad{background:var(--bad-s);color:var(--bad)}.pri{background:var(--pri-s);color:var(--pri)}
.task{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:16px;margin-top:10px;transition:.15s}.task:hover{border-color:var(--pri);transform:translateX(3px)}.task.done{background:var(--ok-s);border-color:transparent}.task.next{border-color:var(--pri);background:var(--pri-s)}
.ico{width:44px;height:44px;border-radius:14px;background:var(--pri-s);display:grid;place-items:center;font-size:22px;flex:none}.done .ico{background:var(--card)}.task>div:nth-child(2){flex:1;min-width:0}
.tl{position:relative;padding-left:26px}.tl .it{position:relative;padding:0 0 18px}.tl .it:before{content:"";position:absolute;left:-19px;top:6px;bottom:-6px;width:2px;background:var(--line)}.tl .it:last-child:before{display:none}
.tl .dot{position:absolute;left:-26px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--card);border:2px solid var(--line)}.tl .done .dot{background:var(--ok);border-color:var(--ok)}.tl .now .dot{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-s)}
.bar2{height:9px;background:var(--line);border-radius:9px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--pri);border-radius:9px;transition:width .6s}
.chat{display:flex;flex-direction:column;gap:12px}.msg{max-width:90%;padding:12px 15px;border-radius:18px;white-space:pre-line}.me{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:4px}.ved{background:var(--pri-s);border-bottom-left-radius:4px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:13px;color:var(--ink);transition:.15s}.chip:hover{border-color:var(--pri);color:var(--pri);background:var(--pri-s)}
.ctx div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}.ctx div:last-child{border:0}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:r .7s linear infinite;display:inline-block;vertical-align:-3px;margin-right:6px}@keyframes r{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;z-index:50;font-size:14px;animation:in .2s;max-width:90%}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 16px;margin-top:10px;color:var(--ink)}.opt:hover:not(:disabled){border-color:var(--pri)}.opt.r{border-color:var(--ok);background:var(--ok-s)}.opt.w{border-color:var(--bad);background:var(--bad-s)}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;font-weight:600}.flow span{padding:6px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}.flow.n span{background:var(--pri);color:#fff;border:0}.flow b{color:var(--mut)}
.link{background:none;border:0;color:var(--pri);font-weight:600;padding:0}.back{margin-bottom:14px}
.tour{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100% - 24px));background:var(--ink);color:var(--bg);border-radius:20px;padding:12px 14px 12px 18px;z-index:25;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px #0004}
.tour .dots{display:flex;gap:5px;margin-top:5px}.tour .dots i{width:18px;height:4px;border-radius:4px;background:#ffffff40}.tour .dots i.on{background:var(--pri)}.tour small{opacity:.7;font-size:11px}
.end{text-align:center;padding:44px 22px;margin-top:24px;background:linear-gradient(135deg,#6d366c,#3f1d3e);color:#fff;border-radius:24px}.end h2{font-size:22px;margin:0 0 10px;line-height:1.35}.end p{opacity:.8;font-size:14px}
.check li{list-style:none;padding:6px 0}.check{padding:0;margin:0}.check li:before{content:"✓";color:var(--ok);font-weight:700;margin-right:10px}
.hello{position:fixed;inset:0;background:#2a1e1acc;z-index:60;display:grid;place-items:center;padding:20px}.hello .card{max-width:440px;text-align:center;padding:30px}
@media(max-width:760px){.grid,.g2{grid-template-columns:1fr}h1{font-size:23px}.bar{padding:10px 14px}.tag{display:none}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:30;gap:0}nav button{padding:6px 2px;font-size:10.5px;flex:1;border-radius:12px;display:flex;flex-direction:column;align-items:center}nav span{margin:0 0 1px;font-size:18px}.bar{justify-content:space-between}.menu{right:14px}
.tour{bottom:calc(72px + env(safe-area-inset-bottom,0px))}.toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}main{padding-bottom:170px}}
</style></head><body><header><div class="bar"><div class="logo"><i>V</i>vedantu <span class="tag">LX 2.0 CONCEPT</span></div><nav id="nav"></nav><button class="av" data-a="menu" aria-label="Account">AS</button></div><div id="menu"></div></header><main id="app"></main><div id="tour"></div><div id="toast"></div><div id="hello"></div>
<script>
const S={s:'home',parent:false,menu:false,done:[0],cur:1,chat:[],typing:false,analysed:false,recovery:false,cls:'ready',missed:false,summary:0,topic:'Electrostatics',q:0,sel:null,score:0,fin:false,improved:false,mentor:false,repl:false,booked:false,insight:false,cat:null,toast:'',intro:true,tour:0};
const PLAN=[['⚡','09:00 AM','Physics live class','Current Electricity · 45 min',null],['➗','04:00 PM','Maths practice','Quadratic Equations · 12 questions · 60 min','Quadratic Equations'],['🧪','06:00 PM','Chemistry revision','Chemical Bonding · 30 min','Chemical Bonding'],['🎯','08:00 PM','Fix my repeat mistakes','Your 5 recurring mistakes · 20 min','Electrostatics']];
const TOUR=[['home','Today\'s plan'],['ved','Ask Ved'],['classes','If class glitches'],['parent','Parent view'],['help','Help desk']];
const TIPS={home:'This is Aarav\'s home screen. Instead of a pile of courses, it tells him exactly what to do today.',journey:'The big idea: Vedantu should not stop at "attend class, take test, get score". It should keep guiding the student.',ved:'Ved is a study buddy that already knows Aarav\'s marks, so it suggests the next step, not just answers.',classes:'What if the internet drops mid-class? Vedantu saves your place and helps you catch up. Try the orange demo button.',progress:'Simple charts that answer: Am I improving? Am I showing up? Am I finishing homework?',parent:'Parents get a different screen: one health score, what is going wrong, and what to do about it.',help:'Every problem gets an owner, a status and a time, like tracking a parcel.',practice:'A short quiz Ved picked to fix a weak topic. Finishing it updates the plan and the parent report.'};
const QB={'Electrostatics':[['Two +2 µC charges are 3 m apart. The force between them is closest to:',['4 mN','4 µN','4 N','0.4 mN'],0],['Electric field inside a charged conducting shell is:',['Maximum at centre','Zero','Same as outside','Infinite'],1],['Work done moving a charge along an equipotential surface is:',['Positive','Negative','Zero','Depends on path'],2]],
'Chemical Bonding':[['Which molecule has a bent shape?',['CO₂','H₂O','BeCl₂','C₂H₂'],1],['Hybridisation of carbon in CH₄ is:',['sp','sp²','sp³','dsp²'],2],['Bond order of O₂ is:',['1','2','3','2.5'],1]],
'Electrostatic Potential':[['Potential due to a point charge q at distance r is:',['kq/r²','kq/r','kqr','q/r²'],1],['Unit of electric potential is:',['Newton','Joule','Volt','Farad'],2],['Potential at the centre of a charged ring depends on:',['Charge & radius','Only charge','Only radius','Nothing'],0]],
'Quadratic Equations':[['Roots of x² − 5x + 6 = 0 are:',['2, 3','1, 6','−2, −3','5, 1'],0],['Discriminant of x² + 2x + 5 is:',['16','−16','24','−4'],1],['Sum of roots of 2x² − 8x + 3 = 0 is:',['4','−4','3/2','8'],0]]};
const ANS={"Why am I weak in Physics?":"Good news first: Physics is up 12% this week, so your concepts are solid. The dip is in Electrostatics, where 4 of your last 6 errors were sign and unit slips, not misunderstanding.\n\nTry a 20-minute sign drill.","What should I revise before tomorrow?":"Revise Electrostatics: Coulomb's law and field lines. It's your biggest chance to gain marks and takes about 20 minutes.","Make me a 7-day JEE plan":"Here's a 7-day shape for your 4 hours a day:\nMon–Tue: Electrostatics + Chemical Bonding\nWed: Quadratics mixed set\nThu: Mistake revision + mini test\nFri–Sat: Current Electricity + Chemistry recall\nSun: Full test and review","Analyse my last test":null};
const $=id=>document.getElementById(id);
function go(s){S.s=s;S.menu=false;scrollTo(0,0);R()}
function toast(t){S.toast=t;R();setTimeout(()=>{if(S.toast===t){S.toast='';R()}},2600)}
const tip=()=>S.s==='practice'&&S.fin?'':`<div class="tip"><span>💡</span><span>${TIPS[S.s]||''}</span></div>`;
function ring(v,c){const r=42,L=2*Math.PI*r;return`<svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="${c}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${L*v/100} ${L}" transform="rotate(-90 55 55)"/><text x="55" y="62" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">${v}</text></svg>`}
function line(d,labels){const w=420,h=150,mx=Math.max(...d)+5,mn=Math.min(...d)-5,p=d.map((v,i)=>[24+i*(w-48)/(d.length-1),h-24-(v-mn)/(mx-mn)*(h-50)]);return`<svg viewBox="0 0 ${w} ${h}" width="100%"><polyline points="${p.map(a=>a.join(',')).join(' ')}" fill="none" stroke="var(--pri)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>${p.map((a,i)=>`<circle cx="${a[0]}" cy="${a[1]}" r="5" fill="var(--pri)"/><text x="${a[0]}" y="${h-4}" text-anchor="middle" font-size="11" fill="var(--mut)">${labels[i]}</text><text x="${a[0]}" y="${a[1]-10}" text-anchor="middle" font-size="11" fill="var(--ink)">${d[i]}%</text>`).join('')}</svg>`}
const bar=(l,v,d,c)=>`<div class="mt2"><div class="row sp sm"><b>${l}</b><span style="color:var(--${d<0?'bad':'ok'});font-weight:600">${v}% ${d<0?'↓':'↑'} ${Math.abs(d)}%</span></div><div class="bar2 mt2"><i style="width:${v}%;background:${c||'var(--pri)'}"></i></div></div>`;
const back=()=>`<button class="link back" data-a="go" data-v="${S.parent?'parent':'home'}">← Back to Dashboard</button>`;
function nav(){const t=S.parent?[['parent','📊','Report'],['help','💬','Help']]:[['home','🏠','Home'],['journey','🧭','My Learning'],['classes','🎥','Classes'],['practice','✏️','Practice'],['ved','✨','Ved AI'],['progress','📈','Progress']];$('nav').innerHTML=t.map(([k,i,l])=>`<button data-a="${k==='practice'?'practice':'go'}" data-v="${k==='practice'?S.topic:k}" class="${S.s===k?'on':''}"><span>${i}</span>${l}</button>`).join('')}
function menu(){$('menu').innerHTML=S.menu?`<div class="menu"><div class="h"><b style="color:var(--ink)">${S.parent?'Mr. Rajesh Sharma':'Aarav Sharma'}</b><br>${S.parent?'Parent of Aarav':'Class 11 · JEE 2027'}</div><button data-a="role">${S.parent?'🎓 Switch to Student view':'👨‍👩‍👦 Switch to Parent view'}</button><button data-a="go" data-v="help">💬 Help & Resolution</button><button data-a="theme">🌓 Dark / light mode</button></div>`:''}
function tourbar(){const t=TOUR[S.tour],last=S.tour>=TOUR.length-1;$('tour').innerHTML=`<div class="tour"><div style="flex:1"><small>GUIDED DEMO · STEP ${S.tour+1} OF ${TOUR.length}</small><div style="font-weight:600;font-size:14px">${t[1]}</div><div class="dots">${TOUR.map((_,i)=>`<i class="${i<=S.tour?'on':''}"></i>`).join('')}</div></div><button class="btn sm" data-a="tour">${last?'Restart ↺':'Next →'}</button></div>`}

function home(){const nx=S.done.length,pct=S.done.length/4*100;return`
<div class="card hero"><p style="opacity:.9;font-size:14px">Thursday evening</p><h1 style="margin-top:4px">Good evening, Aarav 👋</h1><p style="font-size:17px;margin-top:6px;opacity:.95">Your JEE preparation is on track.</p>
<div class="row sp mt" style="align-items:flex-end"><div style="flex:1;min-width:200px"><p class="sm" style="opacity:.9;margin-bottom:6px">${S.done.length} of 4 things done today</p><div class="bar2"><i style="width:${pct}%"></i></div></div><button class="btn w" data-a="startplan">${S.done.length>=4?'All done 🎉':'▶ Start today\'s plan'}</button></div></div>
<div class="grid mt"><div class="card"><h2>What to do today</h2><p class="sm mut">Tap any item to begin.</p>
${PLAN.map((p,i)=>{const d=S.done.includes(i);return`<div class="task ${d?'done':i===nx?'next':''}"><div class="ico">${d?'✅':p[0]}</div><div><span class="sm mut">${p[1]}</span><h3>${p[2]}</h3><span class="sm mut">${p[3]}</span></div>${d?'<span class="pill ok">Done</span>':`<button class="btn sm ${i===nx?'':'sec'}" data-a="item" data-v="${i}">${i===0?'Join':'Start'}</button>`}</div>`}).join('')}</div>
<div><div class="card"><h2>This week</h2>${bar('⚡ Physics',78,12)}${bar('➗ Maths',81,8)}${bar('🧪 Chemistry',64,-4,'var(--bad)')}
<div style="background:var(--warn-s);border-radius:16px;padding:14px;margin-top:16px"><b style="color:var(--warn)">⚠️ Chemistry needs a little attention</b><p class="sm mt2">Your Chemistry accuracy dropped across the last 3 tests.</p><button class="btn sm mt" data-a="practice" data-v="Chemical Bonding">Fix this weak area</button></div></div>
<div class="card mt" style="border:2px solid var(--pri)"><div class="eyebrow">✨ Ved suggests · next best step</div><p>Your biggest chance to gain marks is <b>Electrostatics</b>. A 20-minute revision before tomorrow's class will help.</p><div class="row mt"><button class="btn" data-a="practice" data-v="Electrostatics">Start revision</button><button class="btn sec" data-a="go" data-v="ved">Ask Ved</button></div></div></div></div>
<div class="card mt row sp" style="border-left:5px solid var(--warn)"><div><h3>Physics class was rescheduled</h3><p class="sm mut">Support is arranging a replacement class. Expected by 7:30 PM.</p></div><button class="btn sec sm" data-a="go" data-v="help">View issue →</button></div>
${S.improved?`<div class="card mt" style="background:var(--ok-s);border:0">🎉 Great work! Your practice updated today's plan and your parent's report.</div>`:''}`}
function finale(){return`<div class="end"><h2>“Vedantu doesn't just help students attend classes. It helps them know what to do next.”</h2><p>A concept for the next generation of Vedantu's learning experience.</p></div>`}

function journey(){return`<h1>From Classes to Continuous Learning</h1><p class="mut mt2">One connected system, not five separate features.</p>
<div class="grid g2 mt"><div class="card"><div class="eyebrow" style="color:var(--mut)">Today</div><div class="flow"><span>Course</span><b>→</b><span>Class</span><b>→</b><span>Test</span><b>→</b><span>Score</span></div></div>
<div class="card" style="border:2px solid var(--pri)"><div class="eyebrow">Proposed</div><div class="flow n"><span>Understand</span><b>→</b><span>Plan</span><b>→</b><span>Learn</span><b>→</b><span>Detect</span><b>→</b><span>Intervene</span><b>→</b><span>Improve</span></div></div></div>
<div class="card mt"><h2>How it all connects (tap a step)</h2>
${[['Aarav attends class','His class performance is captured','classes'],['Home updates',"Today's plan changes based on how he did",'home'],['Ved spots a weak topic','…and recommends a short revision','ved'],['Aarav practises','His accuracy improves','practice'],['Parent report updates','Parents see progress and early risks','parent'],['If a class glitches','Vedantu helps him catch up','classes'],['If he needs help','A support case is opened with an owner','help']].map((x,i)=>`<button class="opt" data-a="go" data-v="${x[2]}"><b>${i+1}. ${x[0]}</b> <span class="mut">→ ${x[1]}</span></button>`).join('')}</div>
<div class="card mt"><h2>Our 6 design rules</h2><ul class="check">${['Reliability before novelty','Results over just watching content','AI suggests actions, not just answers','Students and parents see different things','Every problem has an owner and next step','Use data Vedantu already has'].map(x=>`<li>${x}</li>`).join('')}</ul></div>`}

function ved(){return`<h1>Meet Ved ✨ your learning buddy</h1><p class="mut mt2">Not just answers. A smarter next step.</p>
<div class="grid mt"><div class="card"><div class="chat">
<div class="msg me">What should I study today?</div>
<div class="msg ved">You have 4 hours free today. Based on your recent tests, I suggest:\n\n1. Physics: Electrostatics, 45 min\n2. Chemistry: Chemical Bonding, 30 min\n3. Maths: Quadratic Equations, 60 min\n4. Fix repeat mistakes, 20 min\n\nYour Chemistry accuracy dropped 8% recently, so I put it first.<div class="mt"><button class="btn sm" data-a="startplan">Start my plan</button></div></div>
${S.chat.map(m=>`<div class="msg ${m[0]}">${m[1]}</div>`).join('')}${S.typing?'<div class="msg ved"><span class="spin"></span>Ved is checking your marks…</div>':''}</div>
<p class="sm mut mt">Try asking:</p><div class="row mt2">${Object.keys(ANS).map(k=>`<button class="chip" data-a="ask" data-v="${k}">${k}</button>`).join('')}</div></div>
<div><div class="card ctx"><div class="eyebrow">What Ved knows about you</div><div><span class="mut">Goal</span><b>JEE 2027</b></div><div><span class="mut">Weak areas</span><b>Electrostatics, Chem. Bonding</b></div><div><span class="mut">Recent test</span><b>68%</b></div><div><span class="mut">Attendance</span><b>91%</b></div></div>
<div class="card mt" style="border:2px solid var(--pri)"><h2>Ved checked your last test</h2>${S.analysed?`<p class="sm"><b>Going well</b><br>✓ Kinematics<br>✓ Quadratic Equations</p><p class="sm mt"><b>Needs attention</b><br>⚠ Electrostatics<br>⚠ Chemical Bonding</p><p class="sm mt"><b>Common mistake</b><br>“You understand the concept, but calculation slips are increasing.”</p>
${S.recovery?`<div style="background:var(--ok-s);border-radius:14px;padding:14px;margin-top:14px"><b>Your 3-day recovery plan</b><p class="sm mt2">Day 1: Electrostatics sign drill (20 min)<br>Day 2: Chemical Bonding shapes (30 min)<br>Day 3: Mixed 15-question check</p><button class="btn sm mt" data-a="practice" data-v="Electrostatics">Start Day 1</button></div>`:`<button class="btn mt" data-a="recover">Make my recovery plan</button>`}`:`<p class="sm mut">See what went well, what didn't, and what to do about it.</p><button class="btn mt" data-a="analyse" ${S.typing?'disabled':''}>${S.typing?'<span class="spin"></span>Checking…':'Analyse my test'}</button>`}</div></div></div>`}

function classes(){const c=S.cls;return`<h1>Your next live class</h1><p class="mut mt2">⚡ Physics: Current Electricity · Today, 6:00 PM</p>
<div class="grid mt"><div class="card"><div class="row sp"><h2>Is everything ready?</h2><span class="pill ok">● ${c==='dropped'?'Recovering':'98% ready'}</span></div>
<ul class="check">${['Teacher is ready','Study material loaded','Audio check done','Your device works','Internet is stable'].map((x,i)=>c==='dropped'&&i==4?`<li style="color:var(--bad)">Internet dropped for 22 seconds</li>`:`<li>${x}</li>`).join('')}</ul>
${c==='ready'?`<div class="row mt"><button class="btn" data-a="resume">Join class</button><button class="btn sec" data-a="drop">▶ Demo: simulate internet drop</button></div>`:''}
${c==='resumed'?`<div style="background:var(--ok-s);border-radius:14px;padding:14px" class="mt">✓ You're back in class, right where you left off. Nothing was lost.</div><button class="btn sec mt" data-a="drop">Replay demo</button>`:''}</div>
<div>${c==='dropped'?`<div class="card" style="border:2px solid var(--warn)"><div class="eyebrow">Something went wrong</div><h2>Your connection dropped for 22 seconds.</h2><p><b>Don't worry. We saved your progress.</b></p>
<div class="row mt"><button class="btn" data-a="resume">Resume class</button><button class="btn sec" data-a="missed">What did I miss?</button><button class="btn sec" data-a="summary" ${S.summary===1?'disabled':''}>${S.summary===1?'<span class="spin"></span>Writing…':'22-sec summary'}</button></div>
${S.summary===2?`<div style="background:var(--plum-s);border-radius:14px;padding:14px" class="mt"><b>✨ 22-second summary</b><p class="sm mt2">While you were away, the teacher explained that potential is work done per unit charge and wrote V = kq/r.</p></div>`:''}</div>
${S.missed?`<div class="card mt" style="border:2px solid var(--pri)"><h2>You missed: Electrostatic Potential</h2><p class="sm mt2">Ved made this for you:</p><ul class="check"><li>3 key concepts</li><li>1 worked example</li><li>2 practice questions</li></ul><button class="btn" data-a="practice" data-v="Electrostatic Potential">Catch up now</button></div>`:''}`:
`<div class="card hero"><div class="eyebrow" style="color:#fff;opacity:.85">Our promise</div><h2 style="font-size:21px;line-height:1.35">A technical problem should never become a learning problem.</h2><p class="sm" style="opacity:.9">If anything breaks, we save your place, tell you what you missed and help you catch up.</p></div>`}</div></div>`}

function practice(){const qs=QB[S.topic],q=qs[S.q];
if(S.fin)return`<div class="card" style="text-align:center;padding:44px"><div style="font-size:48px">🎉</div><h1>${S.score} of ${qs.length} correct</h1><p class="mut mt2">${S.topic} is updated. Ved will adjust tomorrow's plan.</p><p class="mt sm"><span class="pill ok">✓ Home updated</span> <span class="pill ok">✓ Parent report updated</span></p><button class="btn mt" data-a="go" data-v="home">Back to Home</button></div>`;
return`${back()}<div class="row sp"><div><div class="eyebrow">Practice · ${S.topic}</div><h1>Question ${S.q+1} of ${qs.length}</h1></div><span class="pill pri">✨ Picked by Ved</span></div>
<div class="bar2 mt"><i style="width:${S.q/qs.length*100}%"></i></div><div class="card mt"><h3 style="font-size:18px">${q[0]}</h3>${q[1].map((o,i)=>`<button class="opt ${S.sel!==null?(i===q[2]?'r':i===S.sel?'w':''):''}" data-a="pick" data-v="${i}" ${S.sel!==null?'disabled':''}>${o}</button>`).join('')}
${S.sel!==null?`<p class="sm mt">${S.sel===q[2]?'✓ Correct!':'Not quite. The right answer is highlighted green.'}</p><button class="btn mt" data-a="next">${S.q+1<qs.length?'Next question →':'Finish'}</button>`:''}</div>`}

function progress(){return`<h1>My progress</h1><p class="mut mt2">You're doing well in Physics. Chemistry needs a little attention this week.</p>
<div class="grid g2 mt"><div class="card"><h2>Is my score going up?</h2>${line([58,61,63,66,68],['Test 1','Test 2','Test 3','Test 4','Test 5'])}</div>
<div class="card"><h2>Which subjects are strong?</h2>${bar('⚡ Physics',78,12)}${bar('➗ Maths',81,8)}${bar('🧪 Chemistry',64,-4,'var(--bad)')}</div>
<div class="card"><h2>Am I showing up?</h2><div class="row"><b style="font-size:34px;color:var(--pri)">91%</b><span class="mut sm">of classes attended in the last 4 weeks</span></div><div class="bar2 mt"><i style="width:91%"></i></div></div>
<div class="card"><h2>Am I finishing homework?</h2>${bar('⚡ Physics',88,3)}${bar('➗ Maths',84,2)}${bar('🧪 Chemistry',58,-14,'var(--bad)')}</div></div>`}

function parent(){return`<p class="mut">JEE 2027 · Sample data</p><h1>Aarav's Learning Report</h1>
<div class="grid g2 mt"><div class="card"><h2>Overall learning health</h2><div class="row">${ring(S.improved?84:82,'var(--ok)')}<div><span class="pill ok">On Track</span><p class="sm mut mt2">Attends 91% of classes and is improving in two subjects.</p></div></div></div>
<div class="card"><h2>Subject marks</h2>${bar('⚡ Physics',78,12)}${bar('➗ Maths',81,8)}${bar('🧪 Chemistry',64,-4,'var(--bad)')}</div></div>
<div class="grid g2 mt"><div class="card" style="border:2px solid var(--pri)"><div class="eyebrow">✨ Ved noticed something</div><p>“Aarav attends 91% of classes, but his Chemistry homework completion has fallen to 58% over the last 3 weeks.”</p><p class="mt"><b>What you can do</b><br>Encourage 30 minutes of Chemistry revision after class.</p><button class="btn mt" data-a="insight">${S.insight?'Hide plan':'View recommended plan'}</button>
${S.insight?`<div style="background:var(--pri-s);border-radius:14px;padding:14px" class="mt sm"><b>This week</b><br>Mon, Wed, Fri: 30-min Chemical Bonding after class<br>Sat: 10-question check. Ved shares the result here.</div>`:''}</div>
<div class="card"><h2>Early warning</h2><span class="pill warn">🟡 Chemistry</span><p class="sm mt2"><b>Why</b><br>Marks have dropped in 3 tests in a row.</p><p class="sm mt2"><b>Suggested help</b><br>1 mentor session + a targeted revision plan.</p>
${S.mentor?`<div style="background:var(--ok-s);border-radius:14px;padding:14px" class="mt"><b>✓ Mentor request sent</b><p class="sm mt2">Owner: Academic Mentoring Team. Reply within 24 hrs.</p><button class="link mt2" data-a="go" data-v="help">Track it in Help →</button></div>`:`<button class="btn mt" data-a="mentor">Request mentor support</button>`}</div></div>
<div class="card mt"><h2>Class reliability this month</h2><p class="sm mut">1 interruption was recovered automatically. Aarav didn't lose any learning.</p></div>`}

function help(){const iss=`<div class="card" style="border-left:5px solid var(--warn)"><div class="row sp"><h3>Physics class rescheduled</h3><span class="pill warn">🟡 Being resolved</span></div>
<div class="grid g2 mt sm"><div><span class="mut">Who owns this</span><br><b>Academic Support Team</b></div><div><span class="mut">Expected fix</span><br><b>Today, 7:30 PM</b></div></div>
<div class="tl mt">${[['6:10 PM','Issue reported',1],['6:15 PM','Support team notified',1],['6:35 PM','Replacement class being arranged',2],['7:30 PM','Expected resolution',0]].map(t=>`<div class="it ${t[2]===1?'done':t[2]===2?'now':''}"><div class="dot"></div><span class="sm mut">${t[0]}</span><br><b>${t[1]}</b></div>`).join('')}</div>
<div style="background:var(--pri-s);border-radius:14px;padding:14px" class="mt"><b>What happens next?</b><p class="sm mt2">We're arranging a replacement class. You'll get an update right here.</p><button class="btn sm mt" data-a="repl">${S.repl?'Hide':'View'} replacement classes</button></div>
${S.repl?`<div class="mt">${['Tomorrow, 7:00 AM · Physics: Current Electricity','Tomorrow, 5:00 PM · Physics: Current Electricity'].map((r,i)=>`<div class="row sp task"><span class="sm">${r}</span><button class="btn sm ${S.booked===i?'sec':''}" data-a="book" data-v="${i}">${S.booked===i?'Booked ✓':'Pick this'}</button></div>`).join('')}</div>`:''}</div>`;
const cases=S.mentor?`<div class="card mt" style="border-left:5px solid var(--pri)"><div class="row sp"><h3>Chemistry mentor session</h3><span class="pill pri">Received</span></div><p class="sm mut mt2">Owner: Academic Mentoring Team · Next: mentor assigned within 24 hrs</p></div>`:'';
return`${back()}<h1>How can we help?</h1><p class="mut mt2">Pick a topic, or check on an issue you've already raised.</p>
<div class="row mt">${[['🎥','Class issue'],['💳','Payment'],['🗓️','Schedule'],['👩‍🏫','Teacher'],['🛠️','Technical problem'],['📚','Course'],['↩️','Refund']].map(c=>`<button class="chip" data-a="cat" data-v="${c[1]}" style="${S.cat===c[1]?'border-color:var(--pri);color:var(--pri);background:var(--pri-s)':''}">${c[0]} ${c[1]}</button>`).join('')}</div>
${S.cat?`<div class="card mt"><b>${S.cat}</b><p class="sm mut mt2">Tell us what happened and we'll open a case with an owner and a time to fix it.</p><button class="btn sm mt" data-a="newcase">Open a case</button></div>`:''}
<h2 class="mt">Your open issues</h2>${iss}${cases}`}

function R(){nav();menu();tourbar();const v={home,journey,ved,classes,practice,progress,parent,help}[S.s];$('app').innerHTML=tip()+v()+(S.s==='help'||S.s==='parent'||S.s==='home'?finale():'');$('toast').innerHTML=S.toast?`<div class="toast">${S.toast}</div>`:'';
$('hello').innerHTML=S.intro?`<div class="hello"><div class="card"><div class="logo" style="justify-content:center"><i>V</i>vedantu</div><h1 style="font-size:22px;margin-top:14px">A smarter way to learn</h1><p class="mut mt2">This is a <b>concept</b> for the next Vedantu app. It follows Aarav, a Class 11 JEE student, and shows how the app can tell him <b>what to do next</b>, not just what class to attend.</p><p class="sm mut mt">All names and numbers are sample data.</p><button class="btn mt" data-a="begin">Start the guided demo →</button><br><button class="link mt sm" data-a="skip">Explore on my own</button></div></div>`:''}
function pick(s){S.tour=Math.max(0,TOUR.findIndex(t=>t[0]===s));}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b){if(S.menu){S.menu=false;menu()}return}const a=b.dataset.a,v=b.dataset.v;
if(a==='menu'){S.menu=!S.menu;return menu()}
if(a==='begin'){S.intro=false;return go('home')}
if(a==='skip'){S.intro=false;return R()}
if(a==='tour'){S.tour=S.tour>=TOUR.length-1?0:S.tour+1;S.parent=TOUR[S.tour][0]==='parent'||(TOUR[S.tour][0]==='help'&&S.parent);return go(TOUR[S.tour][0])}
if(a==='go'){const i=TOUR.findIndex(t=>t[0]===v);if(i>=0)S.tour=i;return go(v)}
if(a==='theme'){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';S.menu=false;return R()}
if(a==='role'){S.parent=!S.parent;return go(S.parent?'parent':'home')}
if(a==='startplan'){const i=[0,1,2,3].find(x=>!S.done.includes(x));if(i===undefined)return toast('You finished today\'s plan. Nice!');return item(i)}
if(a==='item')return item(+v);
if(a==='practice'){S.topic=v;S.cur=-1;S.q=0;S.sel=null;S.score=0;S.fin=false;return go('practice')}
if(a==='pick'){S.sel=+v;if(+v===QB[S.topic][S.q][2])S.score++;return R()}
if(a==='next'){if(S.q+1<QB[S.topic].length){S.q++;S.sel=null}else{S.fin=true;S.improved=true;if(S.cur>0&&!S.done.includes(S.cur))S.done.push(S.cur)}return R()}
if(a==='ask'){S.chat.push(['me',v]);S.typing=true;R();return setTimeout(()=>{S.typing=false;if(v==='Analyse my last test'){S.analysed=true;S.chat.push(['ved','Done! Your test breakdown is in the panel next to this chat.'])}else S.chat.push(['ved',ANS[v]]);R()},900)}
if(a==='analyse'){S.typing=true;R();return setTimeout(()=>{S.typing=false;S.analysed=true;R()},1100)}
if(a==='recover'){S.recovery=true;toast('Recovery plan ready ✓');return R()}
if(a==='drop'){S.cls='dropped';S.missed=false;S.summary=0;return R()}
if(a==='resume'){S.cls='resumed';toast('Welcome back. Progress restored ✓');return R()}
if(a==='missed'){S.missed=true;return R()}
if(a==='summary'){S.summary=1;R();return setTimeout(()=>{S.summary=2;R()},1000)}
if(a==='insight'){S.insight=!S.insight;return R()}
if(a==='mentor'){S.mentor=true;toast('Mentor request sent ✓');return R()}
if(a==='repl'){S.repl=!S.repl;return R()}
if(a==='book'){S.booked=+v;toast('Replacement class booked ✓');return R()}
if(a==='cat'){S.cat=v;return R()}
if(a==='newcase'){toast('Case opened. An owner will be assigned shortly.');S.cat=null;return R()}});
function item(i){if(i===0){S.s='classes';S.tour=2;return go('classes')}S.topic=PLAN[i][4];S.cur=i;S.q=0;S.sel=null;S.score=0;S.fin=false;toast('Starting: '+PLAN[i][2]);go('practice')}
R();
</script></body></html>
